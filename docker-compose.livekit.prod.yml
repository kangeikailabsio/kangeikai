# Production LiveKit deploy — Coolify "Docker Compose" resource (NOT "Docker Image": that
# resource type's Port Mappings field doesn't support UDP, see
# https://github.com/coollabsio/coolify/discussions/1014 — WebRTC media needs a UDP range).
#
# NODE_IP/LIVEKIT_KEYS are supplied as environment variables on the Coolify resource itself,
# not committed here. NODE_IP is the host's real public IP (advertised to WebRTC peers for ICE
# candidates); LIVEKIT_KEYS is "key: secret" (generate a real pair for production — never reuse
# docker-compose.dev.yml's dev-only fixed "devkey"/"secret").
#
# Verified against the real image (v1.13.5): with no --bind flag, it already listens on all
# interfaces inside the container. The RTC UDP range is narrowed from LiveKit's own default
# (50000-60000, 10001 ports) to 50000-50100 (101 ports) — publishing the full default range
# made `docker compose up` take long enough (creating ~10k iptables/NAT rules) to blow past
# Coolify's deployment timeout and fail outright. 101 ports is still generous for this MVP's
# scale (one shared room, a handful of concurrent participants — each ties up ~1 UDP port);
# widen it later if actually needed. LIVEKIT_RTC_PORT_RANGE_START/END must be set to match, so
# LiveKit doesn't pick a port outside what's actually published.
services:
  livekit:
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    environment:
      NODE_IP: ${NODE_IP}
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
      LIVEKIT_RTC_PORT_RANGE_START: '50000'
      LIVEKIT_RTC_PORT_RANGE_END: '50100'
    ports:
      - '7880:7880' # HTTP + WebSocket signaling (routed through Coolify's proxy/domain)
      - '7881:7881/tcp' # WebRTC over TCP (fallback) — direct host exposure, bypasses the proxy
      - '50000-50100:50000-50100/udp' # WebRTC over UDP (narrowed range, see note above)
