name: Set up the workspace
description: pnpm (the version in package.json's packageManager), Node, and the frozen dependencies, with the pnpm store cached.

runs:
  using: composite
  steps:
    # No `version`: pnpm/action-setup reads `packageManager` from the root package.json.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
